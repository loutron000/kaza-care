<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | KazaCare</title>

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="navbar navbar-logged-in">
      <div class="navbar-container">
        <a
          href="dashboard.html"
          class="navbar-brand"
          aria-label="Kaza-Care home"
        >
          <img src="assets/logo/logo.jpeg" alt="" class="navbar-logo" />
          <span class="navbar-name">
            <span class="navbar-name-kaza">KAZA</span>
            <span class="navbar-name-care">CARE</span>
          </span>
        </a>

        <button
          class="navbar-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="navbar-menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="navbar-menu" id="navbar-menu" aria-label="Main navigation">
          <ul class="navbar-links">
            <li>
              <a href="dashboard.html" class="navbar-link" aria-current="page"
                >Home</a
              >
            </li>
            <li>
              <a href="map.html" class="navbar-link">Find a Vet</a>
            </li>
            <li>
              <a href="records.html" class="navbar-link">Records</a>
            </li>
          </ul>

          <div class="navbar-actions">
            <button
              class="notification-button"
              type="button"
              aria-label="Notifications"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
                <path d="M10 21h4" />
              </svg>
            </button>

            <button
              class="profile-button"
              type="button"
              aria-label="Open profile menu"
            >
              <span class="profile-avatar" aria-hidden="true">LU</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
          </div>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <!-- Dashboard content will go here later. -->
    </main>
  </body>
</html>
